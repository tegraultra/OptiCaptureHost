name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # NVIDIA's DLSS SDK (headers + static library), from NVIDIA's own public repository, pinned to one commit.
      # If this step fails the host is built without the DLSS option.
      - name: Fetch NVIDIA DLSS SDK
        shell: pwsh
        continue-on-error: true
        run: |
          $c = '374959484e79a640feaba44c93ac8cfb0a03f5b5'
          $base = "https://raw.githubusercontent.com/NVIDIA/DLSS/$c"
          New-Item -ItemType Directory -Force third_party/ngx/include, third_party/ngx/lib | Out-Null
          foreach ($h in 'nvsdk_ngx.h','nvsdk_ngx_defs.h','nvsdk_ngx_defs_dlssd.h','nvsdk_ngx_helpers.h','nvsdk_ngx_helpers_dlssd.h','nvsdk_ngx_params.h') {
            Invoke-WebRequest "$base/include/$h" -OutFile "third_party/ngx/include/$h"
          }
          Invoke-WebRequest "$base/lib/Windows_x86_64/x64/nvsdk_ngx_s.lib" -OutFile third_party/ngx/lib/nvsdk_ngx_s.lib
          Get-ChildItem -Recurse third_party/ngx | Select-Object FullName, Length

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/OptiCaptureHost.exe dist/
          Copy-Item build/Release/OptiCaptureLauncher.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath OptiCaptureHost-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OptiCaptureHost
          path: dist

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $repo = '${{ github.repository }}'

          # remove any old release with this tag (even a broken one), then the tag itself
          $ids = gh api "repos/$repo/releases?per_page=100" --jq '.[] | select(.tag_name=="build-latest") | .id'
          foreach ($id in $ids) { gh api -X DELETE "repos/$repo/releases/$id" | Out-Null }
          gh api -X DELETE "repos/$repo/git/refs/tags/build-latest" | Out-Null
          $global:LASTEXITCODE = 0

          gh release create build-latest OptiCaptureHost-win64.zip --title "Latest build" --notes "Automatic build of the latest commit." --target ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
