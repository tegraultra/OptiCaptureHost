name: build

# Builds only when you start them: Actions tab -> build -> Run workflow. It does NOT make a release.
# Pushes and pull requests no longer start a build by themselves.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # NVIDIA's DLSS SDK (headers + static library), from NVIDIA's own public repository, pinned to the release tag v6.8.0.
      # If this step fails the host is built without DLSS (the host's log then says so).
      - name: Fetch NVIDIA DLSS SDK
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $c = '374959484e79a640feaba44c93ac8cfb0a03f5b5'
          New-Item -ItemType Directory -Force third_party/ngx/include, third_party/ngx/lib | Out-Null
          $files = @{
            'include/nvsdk_ngx.h' = 'include'; 'include/nvsdk_ngx_defs.h' = 'include'; 'include/nvsdk_ngx_defs_dlssd.h' = 'include'
            'include/nvsdk_ngx_helpers.h' = 'include'; 'include/nvsdk_ngx_helpers_dlssd.h' = 'include'; 'include/nvsdk_ngx_params.h' = 'include'
            'lib/Windows_x86_64/x64/nvsdk_ngx_s.lib' = 'lib'
          }
          $hdr = @{ Accept = 'application/vnd.github.raw'; Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'opticapturehost-ci' }
          foreach ($f in $files.Keys) {
            $out = "third_party/ngx/$($files[$f])/$(Split-Path $f -Leaf)"
            try {
              Invoke-WebRequest "https://api.github.com/repos/NVIDIA/DLSS/contents/$($f)?ref=$c" -Headers $hdr -OutFile $out
            } catch { Write-Host "::warning::contents API failed for $f : $_" }
            # a Git LFS pointer instead of the file: take the real one from the LFS media server
            $isPointer = (Test-Path $out) -and ((Get-Item $out).Length -lt 400) -and ((Get-Content $out -TotalCount 1) -like 'version https://git-lfs*')
            if (-not (Test-Path $out) -or $isPointer) {
              try { Invoke-WebRequest "https://media.githubusercontent.com/media/NVIDIA/DLSS/$c/$f" -OutFile $out }
              catch { Write-Host "::warning::could not fetch $f : $_" }
            }
          }
          Get-ChildItem -Recurse third_party/ngx -File | ForEach-Object { Write-Host "$($_.FullName)  $($_.Length)" }
          if (-not (Test-Path third_party/ngx/lib/nvsdk_ngx_s.lib) -or (Get-Item third_party/ngx/lib/nvsdk_ngx_s.lib).Length -lt 100000 -or -not (Test-Path third_party/ngx/include/nvsdk_ngx.h)) {
            Write-Host "::warning::DLSS SDK files are missing or invalid; building without DLSS"
            Remove-Item -Recurse -Force third_party/ngx -ErrorAction SilentlyContinue
            exit 1
          }

      # ReShade's public add-on headers (BSD-3-Clause), pinned to the release tag v6.8.0. Only used for the optional depth add-on; if this fails
      # the add-on is simply not built and everything else is unaffected.
      - name: Fetch ReShade add-on headers
        shell: pwsh
        continue-on-error: true
        run: |
          git clone --depth 1 --branch v6.8.0 https://github.com/crosire/reshade.git reshade_src
          if ($LASTEXITCODE -ne 0) { throw 'could not download the ReShade headers' }
          New-Item -ItemType Directory -Force third_party/reshade/include | Out-Null
          Copy-Item reshade_src/include/*.hpp third_party/reshade/include/
          Copy-Item reshade_src/LICENSE.md third_party/reshade/LICENSE.md
          Get-ChildItem third_party/reshade -Recurse -File | ForEach-Object { Write-Host $_.FullName }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      # The ReShade depth add-on is built on its own and may fail without stopping the build (then it is just missing from the package).
      - name: Build ReShade depth add-on
        continue-on-error: true
        run: cmake --build build --config Release --target OptiCaptureDepthAddon

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/OptiCaptureHost.exe dist/
          Copy-Item build/Release/OptiCaptureLauncher.exe dist/
          Copy-Item README.md dist/
          # optional ReShade depth helper (only when it was built)
          if (Test-Path build/Release/OptiCaptureDepth.addon64) {
            New-Item -ItemType Directory -Force "dist/ReShade depth" | Out-Null
            Copy-Item build/Release/OptiCaptureDepth.addon64 "dist/ReShade depth/"
            Copy-Item reshade/OptiCaptureDepth.fx "dist/ReShade depth/"
            Copy-Item reshade/README.txt "dist/ReShade depth/"
            if (Test-Path third_party/reshade/LICENSE.md) { Copy-Item third_party/reshade/LICENSE.md "dist/ReShade depth/ReShade-LICENSE.txt" }
          } else { Write-Host "::warning::the ReShade depth add-on was not built; the package has no 'ReShade depth' folder" }
          Compress-Archive -Path dist/* -DestinationPath OptiCaptureHost-win64.zip -Force

      # No release is made automatically. The build is attached to the run: Actions tab -> the run -> Artifacts (OptiCaptureHost).
      # Make the release yourself: Releases -> Draft a new release, and attach the files.
      - uses: actions/upload-artifact@v4
        with:
          name: OptiCaptureHost
          path: dist
