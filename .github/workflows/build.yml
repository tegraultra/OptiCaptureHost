name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # NVIDIA's DLSS SDK (headers + static library), from NVIDIA's own public repository, pinned to one commit.
      # If this step fails the host is built without DLSS (the host's log then says so).
      - name: Fetch NVIDIA DLSS SDK
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $c = '374959484e79a640feaba44c93ac8cfb0a03f5b5'
          New-Item -ItemType Directory -Force third_party/ngx/include, third_party/ngx/lib | Out-Null
          $files = @{
            'include/nvsdk_ngx.h' = 'include'; 'include/nvsdk_ngx_defs.h' = 'include'; 'include/nvsdk_ngx_defs_dlssd.h' = 'include'
            'include/nvsdk_ngx_helpers.h' = 'include'; 'include/nvsdk_ngx_helpers_dlssd.h' = 'include'; 'include/nvsdk_ngx_params.h' = 'include'
            'lib/Windows_x86_64/x64/nvsdk_ngx_s.lib' = 'lib'
          }
          $hdr = @{ Accept = 'application/vnd.github.raw'; Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'opticapturehost-ci' }
          foreach ($f in $files.Keys) {
            $out = "third_party/ngx/$($files[$f])/$(Split-Path $f -Leaf)"
            try {
              Invoke-WebRequest "https://api.github.com/repos/NVIDIA/DLSS/contents/$($f)?ref=$c" -Headers $hdr -OutFile $out
            } catch { Write-Host "::warning::contents API failed for $f : $_" }
            # a Git LFS pointer instead of the file: take the real one from the LFS media server
            $isPointer = (Test-Path $out) -and ((Get-Item $out).Length -lt 400) -and ((Get-Content $out -TotalCount 1) -like 'version https://git-lfs*')
            if (-not (Test-Path $out) -or $isPointer) {
              try { Invoke-WebRequest "https://media.githubusercontent.com/media/NVIDIA/DLSS/$c/$f" -OutFile $out }
              catch { Write-Host "::warning::could not fetch $f : $_" }
            }
          }
          Get-ChildItem -Recurse third_party/ngx -File | ForEach-Object { Write-Host "$($_.FullName)  $($_.Length)" }
          if (-not (Test-Path third_party/ngx/lib/nvsdk_ngx_s.lib) -or (Get-Item third_party/ngx/lib/nvsdk_ngx_s.lib).Length -lt 100000 -or -not (Test-Path third_party/ngx/include/nvsdk_ngx.h)) {
            Write-Host "::warning::DLSS SDK files are missing or invalid; building without DLSS"
            Remove-Item -Recurse -Force third_party/ngx -ErrorAction SilentlyContinue
            exit 1
          }

      # Intel's XeSS SDK (headers + libxess.dll), from Intel's own public release, checked against its SHA-256.
      # If this step fails the host is built without XeSS.
      - name: Fetch Intel XeSS SDK
        shell: pwsh
        continue-on-error: true
        run: |
          $url = 'https://github.com/intel/xess/releases/download/v3.0.2/XeSS_SDK_3.0.2.zip'
          $zipSha = '88b8a373f30e33f3558a77a93e634f11b8132fc3047ea1a8edeead32b8471990'
          Invoke-WebRequest $url -OutFile xess_sdk.zip -UseBasicParsing
          $got = (Get-FileHash -Algorithm SHA256 xess_sdk.zip).Hash.ToLowerInvariant()
          if ($got -ne $zipSha) { Write-Host "::warning::XeSS SDK checksum mismatch ($got); building without XeSS"; exit 1 }
          Expand-Archive xess_sdk.zip -DestinationPath xess_sdk -Force
          New-Item -ItemType Directory -Force third_party/xess/inc, xess_runtime | Out-Null
          Copy-Item -Recurse -Force xess_sdk/inc/xess third_party/xess/inc/
          Copy-Item -Force xess_sdk/bin/libxess.dll, xess_sdk/LICENSE.txt xess_runtime/
          Get-ChildItem -Recurse third_party/xess, xess_runtime -File | ForEach-Object { Write-Host "$($_.FullName)  $($_.Length)" }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/OptiCaptureHost.exe dist/
          Copy-Item build/Release/OptiCaptureLauncher.exe dist/
          Copy-Item README.md dist/
          if (Test-Path xess_runtime/libxess.dll) { Copy-Item xess_runtime/libxess.dll dist/; Copy-Item xess_runtime/LICENSE.txt dist/XeSS-LICENSE.txt }
          Compress-Archive -Path dist/* -DestinationPath OptiCaptureHost-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OptiCaptureHost
          path: dist

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $repo = '${{ github.repository }}'

          # remove any old release with this tag (even a broken one), then the tag itself
          $ids = gh api "repos/$repo/releases?per_page=100" --jq '.[] | select(.tag_name=="build-latest") | .id'
          foreach ($id in $ids) { gh api -X DELETE "repos/$repo/releases/$id" | Out-Null }
          gh api -X DELETE "repos/$repo/git/refs/tags/build-latest" | Out-Null
          $global:LASTEXITCODE = 0

          gh release create build-latest OptiCaptureHost-win64.zip --title "Latest build" --notes "Automatic build of the latest commit." --target ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
