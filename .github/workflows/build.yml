name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/OptiCaptureHost.exe dist/
          Copy-Item build/Release/OptiCaptureLauncher.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath OptiCaptureHost-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OptiCaptureHost
          path: dist

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $repo = '${{ github.repository }}'

          # remove any old release with this tag (even a broken one), then the tag itself
          $ids = gh api "repos/$repo/releases?per_page=100" --jq '.[] | select(.tag_name=="build-latest") | .id'
          foreach ($id in $ids) { gh api -X DELETE "repos/$repo/releases/$id" | Out-Null }
          gh api -X DELETE "repos/$repo/git/refs/tags/build-latest" | Out-Null
          $global:LASTEXITCODE = 0

          gh release create build-latest OptiCaptureHost-win64.zip --title "Latest build" --notes "Automatic build of the latest commit." --target ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
